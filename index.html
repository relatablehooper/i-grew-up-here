<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Single entry point for the whole site (see CLAUDE.md section 4).
      Everything is rendered into <div id="app"> by the JavaScript engine.
      The story content itself lives in src/data/content.js — never here.
    -->
    <title>I Grew Up Here</title>
    <meta
      name="description"
      content="A memory palace, in the shape of a gym. A post-modern personal story."
    />

    <!-- Two type families: a literary serif for vignettes, a clean sans for UI
         (CLAUDE.md section 7). They are bundled into the build by main.js via
         @fontsource — NO Google Fonts request happens at runtime, so the page
         renders correctly even on locked-down networks. -->
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <!-- The engine paints every view (map, room, card) into this container. -->
    <div id="app"></div>

    <!-- A persistent corner button so a reader can find "About this project"
         from ANY view. main.js wires up its click to open the overlay; the
         overlay names the post-modern devices for the teacher's check-in. -->
    <button id="about-button" type="button" aria-label="About this project">
      About this project
    </button>

    <!-- ES module entry. Vite bundles everything that this imports. -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
